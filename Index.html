<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ClaimAgent — ต้นแบบระบบวางบิลและโอนเงินเคลมโรงพยาบาล">
  <title>ClaimAgent — Hospital Billing</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:FILL@0..1&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');

    :root {
      --navy: #07558d;
      --blue: #087fbd;
      --bright: #0795d3;
      --bg: #eef2f7;
      --line: #d9e2ec;
      --text: #27384a;
      --muted: #6c7b8b;
      --green: #079447
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Noto Sans Thai", sans-serif
    }

    .material-symbols-rounded {
      font-size: 21px;
      vertical-align: middle
    }

    .app {
      display: flex;
      min-height: 100vh
    }

    .sidebar {
      width: 285px;
      flex: none;
      background: linear-gradient(180deg, #07558d, #0869a7);
      color: #fff;
      transition: .25s;
      overflow-y: auto
    }

    .sidebar.collapsed {
      width: 76px
    }

    .brand {
      height: 72px;
      background: #064c7b;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px;
      font-size: 22px
    }

    .brand-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: #fff;
      color: var(--navy);
      display: grid;
      place-items: center;
      font-weight: 800
    }

    .brand button {
      margin-left: auto;
      background: none;
      border: 0;
      color: white;
      cursor: pointer
    }

    .sidebar.collapsed .brand strong,
    .sidebar.collapsed nav span,
    .sidebar.collapsed .menu-head .material-symbols-rounded:last-child {
      display: none
    }

    .sidebar.collapsed .brand {
      padding: 0 14px
    }

    .sidebar.collapsed .brand button {
      display: none
    }

    .sidebar nav {
      padding: 20px 10px
    }

    .menu-head,
    .nav-link {
      width: 100%;
      min-height: 48px;
      border: 0;
      background: none;
      color: white;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      text-align: left;
      font: 500 14px "Noto Sans Thai";
      cursor: pointer;
      border-radius: 8px;
      text-decoration: none
    }

    .menu-head .material-symbols-rounded:last-child {
      margin-left: auto
    }

    .nav-link {
      font-size: 13px;
      color: #eaf6ff
    }

    .nav-link.active {
      background: rgba(255, 255, 255, .16);
      box-shadow: inset 3px 0 #64d5ff
    }

    .nested {
      padding-left: 12px
    }

    .sidebar.collapsed .nested {
      padding-left: 0
    }

    .main {
      min-width: 0;
      flex: 1;
      padding-bottom: 50px
    }

    .main header {
      height: 72px;
      background: #fff;
      border-bottom: 1px solid #dce3ea;
      display: flex;
      align-items: center;
      padding: 0 32px;
      justify-content: flex-end;
      position: sticky;
      top: 0;
      z-index: 10
    }

    .mobile-menu {
      display: none
    }

    .user {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #657281
    }

    .user>.material-symbols-rounded {
      font-size: 28px;
      color: var(--navy)
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--navy);
      color: #fff
    }

    .titlebar {
      max-width: 1540px;
      margin: 0 auto;
      padding: 27px 30px 18px;
      display: flex;
      justify-content: space-between;
      align-items: end
    }

    .titlebar>div {
      display: flex;
      align-items: center;
      gap: 12px
    }

    .titlebar h1 {
      font-size: 24px;
      margin: 0;
      color: #153a58
    }

    .eyebrow {
      font-size: 12px;
      color: #708499;
      margin: 0 0 3px
    }

    .back {
      width: 42px;
      height: 42px;
      border: 1px solid #d6e1e9;
      background: #fff;
      border-radius: 10px;
      color: var(--navy);
      cursor: pointer
    }

    .primary {
      height: 44px;
      border: 0;
      border-radius: 9px;
      padding: 0 20px;
      background: #0965a5;
      color: white;
      font: 600 14px "Noto Sans Thai";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      cursor: pointer;
      box-shadow: 0 3px 8px #0d6aa522
    }

    .primary.green {
      background: var(--green)
    }

    button:disabled {
      opacity: .42;
      cursor: not-allowed
    }

    .card {
      max-width: 1480px;
      margin: 0 auto 18px;
      background: #fff;
      border: 1px solid #e0e7ee;
      border-radius: 12px;
      box-shadow: 0 3px 14px #264e6e0b
    }

    .filters {
      padding: 20px 22px 22px;
      border-top: 4px solid var(--bright)
    }

    .section-title {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #075c94;
      font-weight: 600;
      margin-bottom: 18px
    }

    .section-title small {
      margin-left: auto;
      color: #768494;
      font-weight: 400
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(145px, 1fr));
      gap: 15px
    }

    .field {
      height: 58px;
      border: 1px solid #9bb1c3;
      border-radius: 9px;
      position: relative;
      background: white;
      display: flex;
      align-items: center
    }

    .field:focus-within {
      border: 2px solid #0789c8;
      box-shadow: 0 0 0 3px #0795d312
    }

    .field>span {
      position: absolute;
      top: -10px;
      left: 12px;
      background: #fff;
      padding: 0 7px;
      font-size: 12px;
      color: #596b7b
    }

    .field input,
    .field select {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 10px 14px 4px;
      font: 400 13px "Noto Sans Thai";
      color: #344b5f
    }

    .field.wide {
      grid-column: span 3
    }

    .search {
      align-self: center
    }

    .table-card {
      overflow: hidden
    }

    .table-meta {
      height: 52px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-weight: 600;
      color: #214a68
    }

    .table-meta span:last-child {
      font-size: 12px;
      background: #eaf4fb;
      color: #0871a9;
      padding: 5px 10px;
      border-radius: 20px
    }

    .table-wrap {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse;
      white-space: nowrap;
      font-size: 12px
    }

    th {
      background: #087fbd;
      color: white;
      padding: 13px 12px;
      text-align: left;
      font-weight: 600
    }

    td {
      padding: 13px 12px;
      border-bottom: 1px solid #e2e8ed;
      color: #425465
    }

    tbody tr:hover {
      background: #f7fbfe
    }

    .code {
      font-weight: 600;
      color: #076aa5
    }

    .num {
      text-align: right;
      font-variant-numeric: tabular-nums
    }

    .more {
      display: inline-block;
      margin-left: 7px;
      background: #eef0f1;
      border-radius: 14px;
      padding: 3px 7px;
      font-size: 10px
    }

    .plan {
      background: #e7f3fb;
      color: #076a9f;
      border-radius: 6px;
      padding: 4px 8px;
      font-weight: 700
    }

    .status {
      padding: 6px 10px;
      border-radius: 16px;
      font-weight: 600;
      font-size: 11px
    }

    .status.รอดำเนินการ {
      background: #fff4cf;
      color: #ac7100
    }

    .status.รอจ่าย {
      background: #ffe4e2;
      color: #c3302b
    }

    .status.จ่ายแล้ว {
      background: #dff7e8;
      color: #087d3d
    }

    .status.จ่ายบางส่วน {
      background: #e8e4ff;
      color: #624abb
    }

    .actions {
      display: flex;
      gap: 5px
    }

    .actions button,
    .icon-btn {
      width: 34px;
      height: 34px;
      border: 1px solid #48aee0;
      border-radius: 50%;
      color: #0785c4;
      background: #e8f6fd;
      display: grid;
      place-items: center;
      cursor: pointer
    }

    .actions button:disabled {
      border-color: #cfd8dd;
      color: #9ba9b0;
      background: #f3f5f6
    }

    .actions .pdf {
      border-color: #f09a95;
      color: #db4138;
      background: #fff0ef
    }

    .empty {
      min-height: 180px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #8494a2;
      gap: 7px
    }

    .empty .material-symbols-rounded {
      font-size: 45px;
      color: #abc0cf
    }

    .empty.initial {
      min-height: 250px
    }

    .add-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 16px
    }

    .choice-block {
      position: relative
    }

    .choice-block>label {
      font-size: 12px;
      color: #596b7b;
      display: block;
      margin-bottom: 6px
    }

    .choice-block i,
    .field>span:last-child {
      color: #dc3c35
    }

    .choice-block small {
      font-size: 11px;
      color: #a0aab2
    }

    .segmented {
      height: 42px;
      display: flex;
      border: 1px solid #9bb1c3;
      border-radius: 9px;
      overflow: hidden
    }

    .segmented button {
      flex: 1;
      border: 0;
      background: #fff;
      color: #587080;
      font: 600 14px "Noto Sans Thai";
      cursor: pointer
    }

    .segmented button+button {
      border-left: 1px solid #d2dce4
    }

    .segmented button.selected {
      background: #087fbd;
      color: white
    }

    .add-grid .wide {
      grid-column: span 3
    }

    .candidate-card {
      min-height: 380px
    }

    .candidate-card th:first-child,
    .candidate-card td:first-child {
      text-align: center
    }

    .candidate-card input[type=checkbox] {
      accent-color: #087fbd;
      width: 16px;
      height: 16px
    }

    .selection-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 14px;
      padding: 18px 22px;
      background: #f4f9fc;
      border-top: 1px solid #dce8ef
    }

    .selection-bar>div {
      background: #e4f2fb;
      color: #086397;
      padding: 12px 16px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      gap: 9px
    }

    .selection-bar div b {
      margin-left: auto
    }

    .generate {
      border: 0;
      border-radius: 9px;
      background: #f9b91f;
      color: #152f43;
      font: 700 14px "Noto Sans Thai";
      cursor: pointer;
      box-shadow: 0 3px 8px #ad730033
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: #062f4d99;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 20px;
      backdrop-filter: blur(2px)
    }

    .modal {
      width: min(620px, 95vw);
      background: #fff;
      border-radius: 18px;
      border: 2px solid #2188c0;
      padding: 30px 42px;
      text-align: center;
      box-shadow: 0 24px 70px #001b2d66;
      animation: pop .2s ease-out
    }

    .modal.success {
      width: min(720px, 95vw)
    }

    @keyframes pop {
      from {
        transform: scale(.94);
        opacity: 0
      }
    }

    .modal-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 12px;
      color: white
    }

    .modal-icon .material-symbols-rounded {
      font-size: 36px
    }

    .modal-icon.warning {
      background: #f8b923;
      border-radius: 16px
    }

    .modal-icon.ok {
      background: #079447
    }

    .modal h2 {
      color: #075b96;
      font-size: 27px;
      margin: 8px
    }

    .modal p {
      color: #667c8c;
      margin: 8px 0 24px
    }

    .summary-line {
      background: #eff6fb;
      border-radius: 12px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      color: #08629e
    }

    .summary-line span {
      display: flex;
      align-items: center;
      gap: 8px
    }

    .modal-actions {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 26px
    }

    .modal-actions button {
      min-width: 150px
    }

    .outline {
      height: 44px;
      border: 2px solid;
      border-radius: 9px;
      background: white;
      font: 600 14px "Noto Sans Thai";
      cursor: pointer
    }

    .outline.danger {
      color: #c92727
    }

    .group-table {
      border: 1px solid #c9d4dc;
      border-radius: 12px;
      overflow: hidden
    }

    .group-head,
    .group-row {
      display: grid;
      grid-template-columns: 1fr 1.4fr .9fr;
      padding: 13px 18px;
      align-items: center
    }

    .group-head {
      background: #087fbd;
      color: white
    }

    .group-row+.group-row {
      border-top: 1px solid #d6dfe5
    }

    .group-row strong {
      color: #078d47
    }

    .success-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 18px 0
    }

    .success-stats>span {
      display: grid;
      grid-template-columns: 45px 1fr;
      grid-template-rows: auto auto;
      text-align: left;
      background: #eff6fb;
      border-radius: 10px;
      padding: 12px 16px;
      color: #075f99
    }

    .success-stats .material-symbols-rounded {
      font-size: 38px;
      grid-row: 1/3;
      align-self: center
    }

    .success-stats small {
      color: #647c8c
    }

    .success-stats b {
      font-size: 18px
    }

    .done {
      min-width: 160px
    }

    @media(max-width:1200px) {
      .filter-grid {
        grid-template-columns: repeat(3, 1fr)
      }

      .add-grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .field.wide,
      .add-grid .wide {
        grid-column: span 2
      }

      .sidebar {
        width: 250px
      }
    }

    @media(max-width:760px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(0)
      }

      .sidebar.collapsed {
        transform: translateX(-100%);
        width: 285px
      }

      .sidebar.collapsed .brand strong,
      .sidebar.collapsed nav span,
      .sidebar.collapsed .menu-head .material-symbols-rounded:last-child {
        display: block
      }

      .main header {
        padding: 0 15px;
        justify-content: space-between
      }

      .mobile-menu {
        display: block;
        border: 0;
        background: none;
        color: var(--navy)
      }

      .user>span:last-child {
        display: none
      }

      .titlebar {
        padding: 20px 15px 14px;
        align-items: center
      }

      .titlebar h1 {
        font-size: 19px
      }

      .titlebar .green {
        font-size: 0;
        width: 44px;
        padding: 0
      }

      .titlebar .green .material-symbols-rounded {
        font-size: 22px
      }

      .card {
        margin: 0 12px 14px
      }

      .filter-grid,
      .add-grid {
        grid-template-columns: 1fr
      }

      .field.wide,
      .add-grid .wide {
        grid-column: auto
      }

      .selection-bar {
        grid-template-columns: 1fr
      }

      .section-title small {
        display: none
      }

      .modal {
        padding: 25px 20px
      }

      .group-head,
      .group-row {
        grid-template-columns: .8fr 1.4fr .7fr;
        font-size: 12px
      }
    }

    /* Required selection area */
    .required-pickers {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 22px
    }

    .picker-panel {
      min-width: 0;
      border: 1px solid #dbe5ec;
      border-radius: 14px;
      background: linear-gradient(145deg, #fbfdff, #f5f9fd);
      padding: 17px;
      transition: .2s
    }

    .picker-panel.complete {
      border-color: #8ec9e7;
      box-shadow: 0 5px 18px #087fbd12
    }

    .picker-heading {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px
    }

    .picker-number {
      width: 31px;
      height: 31px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #e3f2fb;
      color: #0872ad;
      font-weight: 700
    }

    .picker-heading>div {
      display: flex;
      flex-direction: column
    }

    .picker-heading b {
      color: #173e59;
      font-size: 14px
    }

    .picker-heading small {
      color: #7a8b98;
      font-size: 11px
    }

    .required-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      border-radius: 20px;
      padding: 5px 8px;
      background: #fff0ef;
      color: #c54a43;
      font-size: 10px;
      font-weight: 600
    }

    .complete .required-badge {
      background: #e2f7eb;
      color: #078044
    }

    .required-badge .material-symbols-rounded {
      font-size: 15px
    }

    .option-grid {
      display: grid;
      gap: 9px
    }

    .plan-options,
    .claim-options {
      grid-template-columns: repeat(2, 1fr)
    }

    .option-card {
      min-height: 64px;
      border: 1px solid #d5e0e8;
      border-radius: 11px;
      background: #fff;
      color: #496071;
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 20px;
      align-items: center;
      gap: 9px;
      padding: 9px 11px;
      text-align: left;
      font-family: "Noto Sans Thai";
      cursor: pointer;
      transition: .16s
    }

    .option-card:hover {
      border-color: #69b7df;
      transform: translateY(-1px);
      box-shadow: 0 5px 12px #0a669314
    }

    .option-card.selected {
      border: 2px solid #0787c6;
      background: #eef8fe;
      color: #075e93;
      box-shadow: 0 4px 12px #087fbd1a
    }

    .option-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: grid;
      place-items: center;
      background: #eef3f7;
      color: #658092
    }

    .selected .option-icon {
      background: #087fbd;
      color: #fff
    }

    .option-card>span:nth-child(2) {
      display: flex;
      flex-direction: column;
      min-width: 0
    }

    .option-card b {
      font-size: 12px;
      line-height: 1.35
    }

    .option-card small {
      font-size: 10px;
      color: #8796a1
    }

    .option-card>.material-symbols-rounded {
      font-size: 18px;
      color: #afbdc6
    }

    .option-card.selected>.material-symbols-rounded {
      color: #0787c6
    }

    .optional-label {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 13px;
      color: #4c6577;
      font-size: 12px;
      font-weight: 600
    }

    .optional-label:after {
      content: "";
      height: 1px;
      background: #e5ebf0;
      flex: 1
    }

    .optional-label small {
      order: 3;
      background: #eef2f5;
      color: #7d8c97;
      border-radius: 10px;
      padding: 2px 7px;
      font-weight: 400
    }

    .add-filter .add-grid {
      grid-template-columns: minmax(150px, .8fr) minmax(150px, .8fr) minmax(280px, 1.8fr) auto;
      align-items: center
    }

    .add-filter .add-grid .wide {
      grid-column: auto
    }

    .add-filter .search {
      min-width: 174px
    }

    @media(max-width:1200px) {
      .required-pickers {
        grid-template-columns: 1fr
      }

      .add-filter .add-grid {
        grid-template-columns: 1fr 1fr
      }

      .add-filter .add-grid .wide {
        grid-column: span 2
      }
    }

    @media(max-width:760px) {

      .required-pickers,
      .add-filter .add-grid {
        grid-template-columns: 1fr
      }

      .add-filter .add-grid .wide {
        grid-column: auto
      }

      .claim-options {
        grid-template-columns: 1fr
      }

      .picker-heading {
        grid-template-columns: 34px 1fr
      }

      .required-badge {
        grid-column: 2;
        width: max-content
      }
    }

    /* Hospital document receiving */
    .doc-filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr)) auto;
      gap: 15px
    }

    .scan-main {
      background: linear-gradient(135deg, #0869aa, #078fc9)
    }

    .doc-status {
      display: inline-flex;
      padding: 6px 10px;
      border-radius: 15px;
      font-size: 11px;
      font-weight: 600
    }

    }

    .config-overview small {
      color: #718693
    }

    .config-icon {

      height: 48px;
      border-radius: 12px;

    .config-icon .material-symbols-rounded {

    .config-stat {

    }

    .ui-switch {
      min-width: 92px;
      border: 0;
      background: transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #748592;

    }

    .ui-switch i {

      height: 22px;
      border-radius: 12px;
      background: #c8d3da;
      position: relative;
      transition: .2s
    }

    .ui-switch i:after {
      content: "";
      position: absolute;
      width: 16px;
      height: 16px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px #173e5940;
      transition: .2s
    }

    .ui-switch.on {
      color: #087d3f
    }

      background: #079447
    }

    .ui-switch.on i:after {

    }

    .delay-input span {

      color: #718693
    }

    .hold-switch {
      min-width: 160px;
      height: 36px;
      border: 1px solid #a8c5d7;
      border-radius: 8px;
      background: #f1f8fc;
      color: #537184;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font: 600 10px "Noto Sans Thai";
      cursor: pointer
    }

    .hold-switch.on {
      border-color: #e09b95;
      background: #fff0ee;
      color: #bd4038
    }

    .hold-switch .material-symbols-rounded {
      font-size: 18px
    }

    .config-result {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border-radius: 15px;
      font-size: 10px;
      font-weight: 600
    }

    .config-result .material-symbols-rounded {
      font-size: 15px
    }

    .config-result.active {
      background: #dcf6e6;
      color: #087d3f
    }

    .config-result.manual {
      background: #edf3f7;
      color: #607685
    }

    .config-result.held {
      background: #ffe4e2;
      color: #bd3b34
    }

    .receipt-sequence {
      text-align: center;
      font-weight: 700;

    .document-receive-switch {

      background: transparent;

      align-items: center;
      gap: 8px;
      color: #8a98a2;

    }

    .document-receive-switch i {

      height: 20px;
      border-radius: 11px;
      background: #cbd5db;
      position: relative;
      transition: .2s
    }

    .document-receive-switch i:after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      border-radius: 50%;
      background: #fff;
      transition: .2s
    }

    .document-receive-switch.on {
      color: #087d3f
    }

    .document-receive-switch.on i {
      background: #079447
    }

    .document-receive-switch.on i:after {
      transform: translateX(16px)
    }

    .receive-status.received {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap
    }

    .receive-status.received .material-symbols-rounded {
      font-size: 16px

  </script>
  <style>
    .ca-chip-button {
      display: inline-flex;
      align-items: center;
      border: 1px solid #b9d6ff !important;
      background: #eef6ff !important;
      color: #1559a6 !important;
      border-radius: 999px !important;
      padding: 7px 12px !important;
      font-weight: 700;
      white-space: nowrap
    }

    .ca-doc-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(15, 23, 42, .52);
      display: grid;
      place-items: center;
      padding: 24px
    }

    .ca-doc-dialog {
      width: min(720px, 100%);
      max-height: 82vh;
      overflow: auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, .28);
      padding: 24px
    }

    .ca-doc-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px
    }

    .ca-doc-head h2 {
      margin: 0 0 5px
    }

    .ca-doc-head p {
      margin: 0;
      color: #64748b
    }

    .ca-close {
      border: 0;
      background: #f1f5f9;
      border-radius: 10px;
      width: 38px;
      height: 38px;
      cursor: pointer
    }

    .ca-doc-table {
      width: 100%;
      border-collapse: collapse
    }

    .ca-doc-table th,
    .ca-doc-table td {
      padding: 11px 12px;
      border-bottom: 1px solid #e2e8f0;
      text-align: left
    }

    .ca-doc-table th {
      background: #f8fafc;
      color: #475569;
      font-size: 12px
    }

    .ca-round {
      font-weight: 700;
      color: #0f4c81
    }

    .ca-status-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap
    }

    .ca-status-chip.done {
      background: #dcfce7;
      color: #16794a
    }

    .ca-status-chip.wait {
      background: #fff7d6;
      color: #946200
    }

    .ca-scan-actions {
      display: flex;
      justify-content: flex-end;
      padding: 18px 20px;
      border-top: 1px solid #e2e8f0
    }

    .ca-scan-actions .primary {
      min-width: 210px
    }

    .ca-money {
      white-space: nowrap;
      font-weight: 800;
      color: #156f4a
    }

    .ca-confirm-dialog {
      text-align: center;
      max-width: 480px
    }

    .ca-confirm-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #fff4d5;
      color: #ad7100
    }

    .ca-confirm-icon .material-symbols-outlined {
      font-size: 34px
    }

    .ca-confirm-summary {
      background: #f8fafc;
      border-radius: 14px;
      padding: 14px 16px;
      margin: 18px 0;
      text-align: left;
      display: grid;
      gap: 8px
    }

    .ca-confirm-summary div {
      display: flex;
      justify-content: space-between
    }

    .ca-modal-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 20px
    }

    .ca-modal-actions button {
      padding: 10px 18px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background: #fff;
      font-weight: 700;
      cursor: pointer
    }

    .ca-modal-actions .confirm {
      background: #16875e;
      color: #fff;
      border-color: #16875e
    }

    .ca-config-actions {
      display: flex;
      gap: 10px;
      align-items: center
    }

    .ca-secondary-btn {
      border: 1px solid #8bbbd7;
      background: #f5fbff;
      color: #174761;
      border-radius: 9px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer
    }

    .ca-save-row {
      border: 1px solid #0788c2;
      background: #0788c2;
      color: #fff;
      border-radius: 8px;
      padding: 9px 14px;
      font-weight: 700;
      cursor: pointer
    }

    .ca-save-row:disabled {
      border-color: #dce4e9;
      background: #f4f6f7;
      color: #c6d0d6;
      cursor: not-allowed
    }

    .ca-save-row.dirty {
      background: #0788c2;
      color: #fff
    }

    .ca-history-list {
      display: grid;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      overflow: hidden
    }

    .ca-history-row {
      display: grid;
      grid-template-columns: 145px 1fr 170px;
      gap: 12px;
      padding: 12px 14px
    }

    .ca-history-row+div {
      border-top: 1px solid #e2e8f0
    }

    .ca-history-row small {
      color: #64748b
    }

    .ca-form {
      display: grid;
      gap: 14px;
      text-align: left
    }

    .ca-form label {
      display: grid;
      gap: 6px;
      font-weight: 700
    }

    .ca-form .ca-check {
      display: flex;
      align-items: center;
      gap: 9px
    }

    .ca-form .ca-check input {
      width: 18px;
      height: 18px
    }

    .ca-form input {
      height: 42px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      padding: 0 12px;
      font: inherit
    }

    .ca-date-estimate {
      font-weight: 700;
      color: #156f4a;
      white-space: nowrap
    }

    .payment-config-table thead th {
      background: #0788c2 !important;
      color: #fff !important;
      border-color: #0788c2 !important
    }

    .payment-config-table tbody td {
      padding-top: 16px !important;
      padding-bottom: 16px !important
    }

    .ca-inline-history td {
      background: #f5fbff !important;
      padding: 0 14px 14px !important
    }

    .ca-timeline-panel {
      background: #fff;
      border: 1px solid #b9d9ea;
      border-radius: 12px;
      padding: 20px 28px
    }

    .ca-timeline-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #174761;
      font-weight: 700;
      font-size: 16px;
      margin-bottom: 14px

  <script id="ca-v7-monitor-polish-script">
    (function () {
      const clean = el => (el && el.textContent ? el.textContent.replace(/\s+/g, ' ').trim() : '');
      function visibleLabel(el) {
        if (!el) return '';
        const spans = [...el.querySelectorAll('span')].filter(s => !s.classList.contains('material-symbols-rounded'));
        return spans.length ? clean(spans[0]) : clean(el);
      }
      function hideLegacyBillingEntries() {
        const sidebar = document.querySelector('.sidebar');
        if (!sidebar) return;
        const top = [...sidebar.querySelectorAll(':scope nav > .menu-head')].find(b => visibleLabel(b) === 'วางบิล');
        const billingRoot = top && top.nextElementSibling && top.nextElementSibling.classList.contains('nested') ? top.nextElementSibling : null;
        if (!billingRoot) return;
        const billingHead = [...billingRoot.children].find(el => el.matches && el.matches('button.menu-head') && visibleLabel(el) === 'การวางบิล');
        if (billingHead) {
          billingHead.style.display = 'none';
          const next = billingHead.nextElementSibling;
          if (next && next.matches('a.nav-link') && visibleLabel(next) === 'วางบิลโรงพยาบาล') next.style.display = 'none';
        }
        [...billingRoot.querySelectorAll('a.nav-link')].forEach(a => { if (visibleLabel(a) === 'วางบิลโรงพยาบาล') a.style.display = 'none' });
      }
      const colMap = {
        'เลือก': 'ca-col-select', 'เลขที่เคส': 'ca-col-case', 'เลขอ้างอิงการโอน': 'ca-col-ref',
        'วันที่ส่งวางบิล': 'ca-col-date', 'วันที่ทำรายการ': 'ca-col-date', 'วันที่โอนเงิน': 'ca-col-date',
        'วันที่คาดว่าเงินจะออก': 'ca-col-expected', 'ชื่อผู้เอาประกัน': 'ca-col-insured', 'สถานพยาบาล': 'ca-col-hospital',
        'จำนวนราย': 'ca-col-count', 'จำนวนเงิน': 'ca-col-amount', 'ธนาคาร': 'ca-col-bank', 'เลขที่บัญชี': 'ca-col-account',
        'ชื่อบัญชี': 'ca-col-account-name', 'สถานะ': 'ca-col-status', 'สถานะส่งเมล': 'ca-col-mail', 'ดำเนินการ': 'ca-col-action'
      };
      function sizeMonitorColumns() {
        document.querySelectorAll('main .table-card table').forEach(table => {
          const headers = [...table.querySelectorAll('thead th')];
          if (!headers.length) return;
          headers.forEach((th, index) => {
            const label = clean(th.querySelector('.ca-select-head>span') || th);
            const cls = colMap[label];
            if (!cls) return;
            th.classList.add(cls);
            table.querySelectorAll('tbody tr').forEach(tr => { if (tr.cells[index]) tr.cells[index].classList.add(cls) });
          });
        });
      }
      function polish() {
        hideLegacyBillingEntries();
        const heading = [...document.querySelectorAll('h1')].find(h => clean(h) === 'Monitor - โอนเงินเคลมโรงพยาบาล');
        document.body.classList.toggle('ca-monitor-page', !!heading);
        if (heading) sizeMonitorColumns();
      }
      let queued = false;
      const schedule = () => { if (queued) return; queued = true; requestAnimationFrame(() => { queued = false; polish() }) };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', polish, { once: true }); else polish();
      new MutationObserver(schedule).observe(document.getElementById('root') || document.body, { childList: true, subtree: true });
    })();
  </script>
