<style id="ca-v19-partial-receiving">
.ca-v19-progress-count{font-variant-numeric:tabular-nums;display:inline-block;font-size:14px;min-width:48px;font-weight:800;color:#63798a;}
.ca-v19-progress-count.partial{color:#b96f00;}
.ca-v19-progress-count.complete{color:#087c3e;}
.ca-v8-doc-status.ca-v19-partial{background:#fff3d9!important;color:#a96500!important;border-color:#f0c67c!important;}
.ca-v11-expanded-tr .ca-v16-pmh-expanded-entry{line-height:1.5;}
.ca-v19-row-actions{display:flex;gap:7px;align-items:center;justify-content:center;white-space:nowrap;}
.ca-v19-resume{border:1px solid #f2cb86;border-radius:8px;background:#fff8e9;color:#93620a;display:inline-flex;align-items:center;gap:4px;padding:5px 8px;font:600 11px 'Noto Sans Thai',sans-serif;cursor:pointer;}
.ca-v19-resume:hover{background:#ffedc4;border-color:#dba54a;}
.ca-v19-resume .material-symbols-rounded{font-size:16px;}

<style id="ca-v21-receiving-polish">
  .ca-v10-case-section .ca-v8-table-scroll table{min-width:1070px}
  .ca-v21-status-empty{color:#8da1af;font-weight:600}
  .ca-v21-history-details{max-width:720px;margin-top:9px;width:100%;border:1px solid #d9e8f1;background:#f7fbfe;border-radius:11px;overflow:hidden}
  .ca-v21-history-details summary{cursor:pointer;display:flex;align-items:center;gap:7px;padding:10px 13px;color:#0874ae;font-size:12px;font-weight:750;list-style:none;user-select:none}
  .ca-v21-history-details summary::-webkit-details-marker{display:none}
  .ca-v21-history-details summary .material-symbols-rounded{font-size:17px;transition:transform .15s ease}
  .ca-v21-history-details[open] summary .material-symbols-rounded{transform:rotate(180deg)}
  .ca-v21-history-details summary:hover{background:#e8f5fe}
  .ca-v21-history-table-wrap{overflow-x:auto;padding:0 10px 11px}
  .ca-v21-history-table-wrap table{width:100%;font-size:11px;white-space:nowrap;border-radius:7px;overflow:hidden}
  .ca-v21-history-table-wrap th{background:#e7f2fb;color:#275c7e;padding:9px 12px}
  .ca-v21-history-table-wrap td{background:#fff;padding:9px 12px}
  .ca-v21-method-tag{display:inline-flex;border-radius:10px;background:#e8f5fd;color:#0876b4!important;padding:3px 9px;font-size:11px;font-weight:650}

    function closeModal(){document.querySelector('.ca-doc-modal')?.remove()}
    function showAddHospital(){const overlay=document.createElement('div');overlay.className='ca-doc-modal ca-hospital-overlay';overlay.innerHTML=`<div class="ca-doc-dialog ca-hospital-modal"><div class="ca-hospital-hero"><div class="ca-hospital-hero-icon"><span class="material-symbols-rounded">domain_add</span></div><div><span class="ca-hospital-kicker">PAYMENT CONFIGURATION</span><h2>เพิ่มสถานพยาบาลที่ต้องการตั้งค่า</h2><p>กำหนดวิธีจ่ายเงินและ Delay สำหรับสถานพยาบาลใหม่ได้จากที่เดียว</p></div><button class="ca-close cancel" aria-label="ปิด"><span class="material-symbols-rounded">close</span></button></div><div class="ca-hospital-body"><div class="ca-hospital-field ca-hospital-field-wide"><label>ชื่อสถานพยาบาล <span class="required">*</span></label><div class="ca-input-icon"><span class="material-symbols-rounded">local_hospital</span><input id="ca-hospital-name" placeholder="เช่น โรงพยาบาลกรุงเทพ"></div></div><div class="ca-hospital-setting-card"><div class="ca-setting-icon auto"><span class="material-symbols-rounded">bolt</span></div><div class="ca-setting-copy"><b>จ่ายเงินอัตโนมัติ</b><small>เปิดเพื่อให้ระบบเตรียมวันจ่ายตาม Delay ที่กำหนด</small></div><label class="ca-premium-switch"><input id="ca-hospital-auto" type="checkbox"><span></span></label></div><div class="ca-hospital-field"><label>Delay การจ่ายเงิน <span class="required">*</span></label><div class="ca-delay-premium"><input id="ca-hospital-delay" type="number" min="0" max="30" value="0"><span>วัน</span></div><small>ใช้คำนวณวันที่คาดว่าเงินจะออก</small></div><div class="ca-hospital-setting-card hold-card"><div class="ca-setting-icon hold"><span class="material-symbols-rounded">pause_circle</span></div><div class="ca-setting-copy"><b>Hold การจ่ายเงิน</b><small>พักการจ่ายของสถานพยาบาลนี้ชั่วคราว</small></div><label class="ca-premium-switch hold"><input id="ca-hospital-hold" type="checkbox"><span></span></label></div><div class="ca-hospital-preview"><span class="material-symbols-rounded">info</span><div><b>หลังบันทึก</b><small>สถานพยาบาลจะถูกเพิ่มในตารางตั้งค่าทันที และสามารถแก้ไขหรือดูประวัติภายหลังได้</small></div></div></div><div class="ca-hospital-actions"><button class="cancel outline">ยกเลิก</button><button class="confirm primary"><span class="material-symbols-rounded">add_circle</span> เพิ่มและบันทึกการตั้งค่า</button></div></div>`;overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('.cancel'))overlay.remove();if(e.target.closest('.confirm')){const name=overlay.querySelector('#ca-hospital-name').value.trim();if(!name){overlay.querySelector('#ca-hospital-name').focus();overlay.querySelector('.ca-input-icon').classList.add('error');return}const delay=Math.max(0,Number(overlay.querySelector('#ca-hospital-delay').value)||0),auto=overlay.querySelector('#ca-hospital-auto').checked,hold=overlay.querySelector('#ca-hospital-hold').checked;customHospitals.push({name,delay,auto,hold});configHistory.unshift({time:'01/08/2569 10:15',hospital:name,action:`เพิ่มและบันทึกการตั้งค่า · ${auto?'เปิด':'ปิด'}จ่ายอัตโนมัติ · Delay ${delay} วัน · ${hold?'Hold':'ปกติ'}`,user:'09104 ฉัตรชนก ปักษาทอง'});overlay.remove();run()}});document.body.appendChild(overlay);setTimeout(()=>overlay.querySelector('#ca-hospital-name')?.focus(),0)}
    function showConfigHistory(hospital=''){const records=hospital?configHistory.filter(x=>x.hospital===hospital):configHistory;const overlay=document.createElement('div');overlay.className='ca-doc-modal';overlay.innerHTML=`<div class="ca-doc-dialog"><div class="ca-doc-head"><div><h2>ประวัติการทำรายการ${hospital?` — ${hospital}`:''}</h2><p>แสดงเฉพาะการตั้งค่าที่กดบันทึกแล้ว</p></div><button class="ca-close" aria-label="ปิด"><span class="material-symbols-rounded">close</span></button></div><div class="ca-history-list">${records.length?records.map(x=>`<div class="ca-history-row"><small>${x.time}</small><div><b>${x.hospital}</b><br><span>${x.action}</span></div><small>${x.user}</small></div>`).join(''):'<div class="empty">ยังไม่มีประวัติการบันทึก</div>'}</div></div>`;overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('.ca-close'))overlay.remove()});document.body.appendChild(overlay)}
    function toggleInlineHistory(row,hospital,button){const next=row.nextElementSibling;if(next?.classList.contains('ca-inline-history')){next.remove();button.classList.remove('ca-history-open');return}document.querySelectorAll('.ca-inline-history').forEach(x=>x.remove());document.querySelectorAll('.ca-row-history').forEach(x=>x.classList.remove('ca-history-open'));const records=configHistory.filter(x=>x.hospital===hospital);const detail=document.createElement('tr');detail.className='ca-inline-history';const cols=row.closest('table').querySelectorAll('thead th').length;detail.innerHTML=`<td colspan="${cols}"><div class="ca-timeline-panel"><div class="ca-timeline-title"><span class="material-symbols-rounded">history</span> ประวัติการตั้งค่า — ${hospital}</div><div class="ca-timeline">${records.length?records.map(x=>`<div class="ca-event"><b>${x.action}</b><small>${x.time} · ผู้ทำรายการ: ${x.user}</small></div>`).join(''):'<div class="ca-event"><b>ยังไม่มีประวัติการบันทึก</b></div>'}</div></div></td>`;row.after(detail);button.classList.add('ca-history-open')}
    function showDocumentRounds(rowIndex){
      const count=10+rowIndex; const refs=Array.from({length:count},(_,i)=>`HC6907${String(rowIndex*100+i+1).padStart(7,'0')}`);
      const rounds=refs.map((_,i)=>`BGN6904${String(rowIndex*100+i+1).padStart(6,'0')}`);
      const overlay=document.createElement('div');overlay.className='ca-doc-modal';
      overlay.innerHTML=`<div class="ca-doc-dialog"><div class="ca-doc-head"><div><h2>ใบคุมโรงพยาบาลและเลขรอบวางบิล</h2><p>${count} ใบคุม รพ. ในรายการวางบิลนี้</p></div><button class="ca-close" aria-label="ปิด"><span class="material-symbols-rounded">close</span></button></div><table class="ca-doc-table"><thead><tr><th>ลำดับ</th><th>เลขอ้างอิงใบคุม รพ.</th><th>เลขรอบวางบิล</th></tr></thead><tbody>${refs.map((r,i)=>`<tr><td>${i+1}</td><td><span class="code">${r}</span></td><td><span class="ca-round">${rounds[i]}</span></td></tr>`).join('')}</tbody></table></div>`;
      overlay.addEventListener('click',e=>{if(e.target===overlay||e.target.closest('.ca-close'))closeModal()});document.body.appendChild(overlay);
    }
    function captureSelection(){
      const table=document.querySelector('.candidate-card table'); if(!table)return;
      const heads=[...table.querySelectorAll('thead th')].map(x=>x.textContent.trim());
      const insurer=heads.indexOf('บริษัทประกัน'), amount=heads.indexOf('ยอดเงินรายเคลม');
      const byInsurer={};let total=0;const items=[];
      table.querySelectorAll('tbody tr').forEach(r=>{const cb=r.querySelector('input[type=checkbox]');if(!cb?.checked)return;const cells=r.cells;const key=cells[insurer]?.textContent.trim()||'บริษัทประกัน';const value=parseMoney(cells[amount]?.textContent);byInsurer[key]=(byInsurer[key]||0)+value;total+=value;const val=name=>{const i=heads.indexOf(name);return i>=0?cells[i]?.textContent.trim()||'':''};items.push({plan:val('กลุ่มแผนประกัน'),hospital:val('สถานพยาบาล'),hospitalRef:val('เลขอ้างอิงใบคุม รพ.')||val('เลขอ้างอิงใบคุม รพ'),claim:val('เลขที่เคส'),amount:value,date:val('วันที่อนุมัติจ่าย'),insurer:key})});
      selectedGroups={total,byInsurer,items};
    }
    function enhanceCandidate(){
      const table=document.querySelector('.candidate-card table');if(!table)return;
      const headers=[...table.querySelectorAll('thead th')];
      let typeIndex=headers.findIndex(h=>h.textContent.trim()==='ประเภทงานเคลม');
      if(typeIndex>=0){headers[typeIndex].remove();table.querySelectorAll('tbody tr').forEach(r=>r.cells[typeIndex]?.remove())}
      const hs=[...table.querySelectorAll('thead th')];let amountIndex=hs.findIndex(h=>h.textContent.trim()==='ยอดเงินรายเคลม');
      if(amountIndex>=0&&!hs.some(h=>h.textContent.trim()==='เลขรอบวางบิล')){
        const th=document.createElement('th');th.textContent='เลขรอบวางบิล';hs[amountIndex].after(th);
        table.querySelectorAll('tbody tr').forEach((r,i)=>{const td=document.createElement('td');td.className='ca-round';td.textContent=`BGN6904${String(i+1).padStart(6,'0')}`;r.cells[amountIndex].after(td)})
      }
      table.querySelectorAll('input[type=checkbox]').forEach(cb=>{if(!cb.dataset.caCapture){cb.dataset.caCapture='1';cb.addEventListener('change',()=>setTimeout(captureSelection))}})
    }
    function enhanceSuccess(){
      const modal=[...document.querySelectorAll('.modal.success')].find(m=>m.querySelector('h2')?.textContent.includes('Generate Group สำเร็จ'));if(!modal)return;
      const table=modal.querySelector('.group-table');if(table&&!table.dataset.caSingle){table.dataset.caSingle='1';const count=[...document.querySelectorAll('.candidate-card tbody input[type="checkbox"]')].filter(x=>x.checked).length;table.innerHTML=`<div class="group-head"><span>เลข CPBG</span><span>จำนวนเคลม</span><span>ยอดเงิน</span></div><div class="group-row"><b class="code">CPBG6907000006</b><strong>${count} รายการ</strong><strong class="ca-money">${baht(selectedGroups.total)}</strong></div>`;const p=modal.querySelector('p');if(p)p.textContent='ระบบรวมรายการเคลมที่เลือกเป็นกรุ๊ปเดียวเรียบร้อยแล้ว'}
      modal.querySelector('.success-stats')?.remove();
    }
    function enhanceBillingList(){
      const section=[...document.querySelectorAll('section.table-card')].find(s=>s.querySelector('.table-meta')?.textContent.includes('รายการวางบิลทั้งหมด'));if(!section)return;

      const table=section.querySelector('table');if(!table)return;const heads=[...table.querySelectorAll('thead th')];const refIndex=heads.findIndex(h=>h.textContent.includes('เลขอ้างอิงใบคุม'));
      if(refIndex>=0){heads[refIndex].textContent='เลขอ้างอิงใบคุม รพ.';table.querySelectorAll('tbody tr').forEach((r,i)=>{const cell=r.cells[refIndex];if(!cell||cell.dataset.caChip)return;cell.dataset.caChip='1';const count=10+i;cell.innerHTML='';const btn=document.createElement('button');btn.className='ca-chip-button';btn.textContent=`${count} ใบคุม รพ.`;btn.addEventListener('click',()=>showDocumentRounds(i));cell.append(btn)})}
      table.querySelectorAll('tbody tr').forEach((r,i)=>{const view=[...r.querySelectorAll('button')].find(b=>(b.title||'')==='ดูรายละเอียด');if(view&&!view.dataset.caGroup){view.dataset.caGroup='1';view.addEventListener('click',()=>activeBillingRowIndex=i,true)}})
      table.querySelectorAll('tbody tr').forEach(r=>{[...r.querySelectorAll('.status,td')].forEach(x=>{if(x.textContent.trim()==='รอดำเนินการ'){x.textContent='รอสร้างรายการ';x.classList.remove('รอดำเนินการ');x.classList.add('รอสร้างรายการ')}})});
      const created=[...table.querySelectorAll('tbody tr')].filter(r=>{const id=r.cells[0]?.textContent.trim()||'';return /^CPBG69070000\d+$/.test(id)&&Number(id.slice(-2))>=6});if(created.length){const first=created[0];first.cells[0].textContent='CPBG6907000006';first.cells[0].classList.add('code');const amountIndex=heads.findIndex(h=>h.textContent.trim()==='ยอดเงินรวม'),countIndex=heads.findIndex(h=>h.textContent.trim()==='จำนวนราย'),insurerIndex=heads.findIndex(h=>h.textContent.trim()==='บริษัทประกัน');if(amountIndex>=0&&selectedGroups.total)first.cells[amountIndex].textContent=new Intl.NumberFormat('th-TH',{maximumFractionDigits:0}).format(selectedGroups.total);if(countIndex>=0&&selectedGroups.items.length)first.cells[countIndex].textContent=selectedGroups.items.length;if(insurerIndex>=0)first.cells[insurerIndex].innerHTML=`<b>${Object.keys(selectedGroups.byInsurer).join(', ')}</b>`;created.slice(1).forEach(r=>r.remove())}
    }
    function enhanceBillingDetail(){
      const heading=[...document.querySelectorAll('h1')].find(h=>h.textContent.includes('รายละเอียดรายการวางบิล'));if(!heading)return;
      document.querySelectorAll('.billing-detail-summary .ca-detail-ref,.billing-detail-summary .ca-detail-round').forEach(x=>x.remove());
      const table=document.querySelector('.billing-claims-table table');if(!table)return;const hs=[...table.querySelectorAll('thead th')];if(hs.some(h=>h.textContent.trim()==='เลขรอบวางบิล'))return;

    if(!sidebar) return;
    const top=[...sidebar.querySelectorAll(':scope nav > .menu-head')].find(b=>visibleLabel(b)==='วางบิล');
    const billingRoot=top && top.nextElementSibling && top.nextElementSibling.classList.contains('nested') ? top.nextElementSibling : null;
    if(!billingRoot) return;
    const billingHead=[...billingRoot.children].find(el=>el.matches && el.matches('button.menu-head') && visibleLabel(el)==='การวางบิล');
    if(billingHead){
      billingHead.style.display='none';
      const next=billingHead.nextElementSibling;
      if(next && next.matches('a.nav-link') && visibleLabel(next)==='วางบิลโรงพยาบาล') next.style.display='none';
    }
    [...billingRoot.querySelectorAll('a.nav-link')].forEach(a=>{if(visibleLabel(a)==='วางบิลโรงพยาบาล')a.style.display='none'});
  }
  const colMap={
    'เลือก':'ca-col-select','เลขที่เคส':'ca-col-case','เลขอ้างอิงการโอน':'ca-col-ref',
    'วันที่ส่งวางบิล':'ca-col-date','วันที่ทำรายการ':'ca-col-date','วันที่โอนเงิน':'ca-col-date',
    'วันที่คาดว่าเงินจะออก':'ca-col-expected','ชื่อผู้เอาประกัน':'ca-col-insured','สถานพยาบาล':'ca-col-hospital',
    'จำนวนราย':'ca-col-count','จำนวนเงิน':'ca-col-amount','ธนาคาร':'ca-col-bank','เลขที่บัญชี':'ca-col-account',
    'ชื่อบัญชี':'ca-col-account-name','สถานะ':'ca-col-status','สถานะส่งเมล':'ca-col-mail','ดำเนินการ':'ca-col-action'
  };
  function sizeMonitorColumns(){
    document.querySelectorAll('main .table-card table').forEach(table=>{
      const headers=[...table.querySelectorAll('thead th')];
      if(!headers.length) return;
      headers.forEach((th,index)=>{
        const label=clean(th.querySelector('.ca-select-head>span') || th);
        const cls=colMap[label];
        if(!cls) return;
        th.classList.add(cls);
        table.querySelectorAll('tbody tr').forEach(tr=>{if(tr.cells[index])tr.cells[index].classList.add(cls)});
      });
    });
  }
  function polish(){
    hideLegacyBillingEntries();
    const heading=[...document.querySelectorAll('h1')].find(h=>clean(h)==='Monitor - โอนเงินเคลมโรงพยาบาล');
    document.body.classList.toggle('ca-monitor-page',!!heading || !!document.querySelector('.ca-transfer-review-page, .ca-transfer-confirm-overlay'));
    if(heading) sizeMonitorColumns();
  }
  let queued=false;
  const schedule=()=>{if(queued)return;queued=true;requestAnimationFrame(()=>{queued=false;polish()})};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',polish,{once:true});else polish();
  new MutationObserver(schedule).observe(document.getElementById('root')||document.body,{childList:true,subtree:true});
})();
</script>

<script id="ca-download-html-menu">
(()=>{
  const addDownloadMenu=()=>{
    const nav=document.querySelector('.sidebar nav');
    if(!nav||nav.querySelector('.ca-download-nav'))return;
    const button=document.createElement('button');
    button.type='button';
    button.className='nav-link ca-download-nav';
    button.innerHTML='<span class="material-symbols-rounded" aria-hidden="true">download</span><span>ดาวน์โหลดไฟล์ HTML</span>';
    button.addEventListener('click',async()=>{
      let source;
      try{source=await fetch(location.href,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('download');return r.text()})}
      catch{source='<!DOCTYPE html>\n'+document.documentElement.outerHTML}
      const blob=new Blob([source],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');
      link.href=url;link.download='ClaimAgent-Hospital-Billing.html';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),500)
    });
    nav.appendChild(button)
  };
  new MutationObserver(addDownloadMenu).observe(document.getElementById('root'),{childList:true,subtree:true});
  addDownloadMenu()
})();
</script>

<script id="ca-v8-action-flyout">
(function(){
  function position(button){
    if(!button || !button.isConnected)return;
    const parent=button.closest('.action-cell'),menu=parent?.querySelector('.action-menu');
    if(!menu)return;
    const rect=button.getBoundingClientRect(),w=218,h=menu.getBoundingClientRect().height||250;
    const left=Math.max(10,Math.min(rect.right-w,window.innerWidth-w-12));
    const top=rect.bottom+h+10>window.innerHeight&&rect.top>h+12?rect.top-h-6:Math.min(rect.bottom+7,window.innerHeight-h-12);
    menu.style.setProperty('--ca-fly-left',left+'px');menu.style.setProperty('--ca-fly-top',Math.max(9,top)+'px');
  }
  document.addEventListener('click',event=>{
    const button=event.target.closest?.('.transfer-table .action-trigger.dots');
    if(button)requestAnimationFrame(()=>position(button));
  },true);
  document.addEventListener('scroll',()=>{
    document.querySelectorAll('.transfer-table .action-menu').forEach(m=>position(m.closest('.action-cell')?.querySelector('.action-trigger')));
  },true);
  window.addEventListener('resize',()=>document.querySelectorAll('.transfer-table .action-menu').forEach(m=>position(m.closest('.action-cell')?.querySelector('.action-trigger'))));
})();
</script>
